name: Quality checks

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11.20.0
      - name: Install locked dependencies
        run: npm ci
      - name: Restore data and run independent quality checks
        run: npm run check
