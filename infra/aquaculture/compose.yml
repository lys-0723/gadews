services:
  postgres:
    image: postgres:16-alpine
    container_name: gadews-aquaculture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gadews}
      POSTGRES_USER: ${POSTGRES_USER:-gadews}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gadews_dev_only}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - gadews_aquaculture_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gadews} -d ${POSTGRES_DB:-gadews}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gadews_aquaculture_postgres_data:
